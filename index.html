<title>Python Backend & AI Engineer: путь до оффера</title>
<style>
:root{--b:#2563eb;--line:#e5e7eb;--mut:#6b7280;--txt:#111827;--bg:#f9fafb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:30px;line-height:1.2;margin:0 0 10px;letter-spacing:-.02em}
.lead{color:var(--mut);max-width:760px;margin:0 0 24px}
.prog{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.prog b{font-weight:600}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--b);transition:width .25s}
button{font:inherit;cursor:pointer}
.reset{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--mut)}
.reset:hover{color:var(--txt);border-color:#cbd5e1}
nav{display:flex;gap:6px;overflow-x:auto;padding:20px 0 12px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:var(--txt);white-space:nowrap}
.tab span{color:var(--mut);margin-left:6px;font-size:13px}
.tab.on{background:var(--b);border-color:var(--b);color:#fff}
.tab.on span{color:#dbeafe}
.tab.sep{margin-left:14px}
.stage{font-size:13px;color:var(--b);font-weight:600;margin:12px 0 4px}
h2{font-size:22px;margin:0 0 6px}
.goal{color:var(--mut);margin:0 0 18px;max-width:820px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:110px 1fr 1fr;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.hd{background:#f3f4f6;font-weight:600;font-size:13px;color:var(--mut)}
.row>div{padding:14px 16px}
.row>div+div{border-left:1px solid var(--line)}
.day{font-weight:600}.day small{display:block;color:var(--mut);font-weight:400}
.row.proj{grid-template-columns:110px 1fr}
.item{display:flex;gap:10px;align-items:flex-start}
.item input{margin-top:5px;width:16px;height:16px;accent-color:var(--b);flex:none;cursor:pointer}
.item.done .tt{color:var(--mut);text-decoration:line-through}
.tt{font-weight:600}
.kw{color:var(--mut);font-size:13.5px;margin-top:2px}
.ln{margin-top:6px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 12px}
a{color:var(--b);text-decoration:none}a:hover{text-decoration:underline}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:14px}
.sec h3{margin:0 0 10px;font-size:17px}
.sec ul{margin:0;padding-left:20px}.sec li{margin:5px 0}
@media(max-width:760px){.row,.row.proj{grid-template-columns:1fr}.row>div+div{border-left:0;border-top:1px dashed var(--line)}.hd{display:none}h1{font-size:24px}}
</style>
</head>

// ---------- логика ----------
const KEY="py-ai-roadmap-v2";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let cur=localStorage.getItem(KEY+"-tab")||"0";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const days=["Пн","Вт","Ср","Чт","Пт"];
const ids=w=>[...Array(5).keys()].flatMap(i=>["t","p"].map(k=>`${w}-${i}-${k}`)).concat([`${w}-s`,`${w}-u`]);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const links=a=>`<div class="ln">${a.map(k=>`<a href="${L[k][1]}" target="_blank" rel="noopener">${L[k][0]}</a>`).join("")}</div>`;
const item=(id,title,kw,ln)=>`<label class="item${st[id]?" done":""}"><input type="checkbox" data-id="${id}"${st[id]?" checked":""}><div><div class="tt">${esc(title)}</div>${kw?`<div class="kw">${esc(kw)}</div>`:""}${ln||""}</div></label>`;
const cnt=w=>ids(w).filter(i=>st[i]).length;
const TOTAL=W.length*12;
const HOURS=W.length*18;
document.getElementById("lead").textContent=`Режим: 2 часа в будни (1 ч теории + 1 ч практики руками) и 2 × 4 часа на пет-проект в выходные. ${W.length} недель, примерно ${HOURS} часов (18 ч в неделю). Первые 3 недели — медленное повторение базы с нуля. Практика пишется самостоятельно, ИИ — только как репетитор.`;

function nav(){
 const n=document.getElementById("nav");
 n.innerHTML=W.map((w,i)=>`<button class="tab${cur==i?" on":""}" data-tab="${i}" title="${esc(w.t)}">Неделя ${i+1}<span>${cnt(i)}/12</span></button>`).join("")
 +`<button class="tab sep${cur=="m"?" on":""}" data-tab="m">База материалов</button><button class="tab${cur=="r"?" on":""}" data-tab="r">Правила обучения</button>`;
}
function prog(){
 const done=W.reduce((s,_,i)=>s+cnt(i),0),pc=Math.round(done/TOTAL*100);
 document.getElementById("ptxt").innerHTML=`<b>Общий прогресс:</b> ${done} из ${TOTAL} · ${pc}%`;
 document.getElementById("pbar").style.width=pc+"%";
}
function view(){
 const m=document.getElementById("main");
 if(cur=="m"){m.innerHTML=MAT.map(([h,a])=>`<div class="sec"><h3>${h}</h3><ul>${a.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join("")}</ul></div>`).join("");return}
 if(cur=="r"){m.innerHTML=RULES.map(([h,a])=>`<div class="sec"><h3>${h}</h3><ul>${a.map(t=>`<li>${t}</li>`).join("")}</ul></div>`).join("");return}
 const i=+cur,w=W[i];
 let h=`<div class="stage">${w.s}</div><h2>Неделя ${i+1}: ${esc(w.t)}</h2><p class="goal"><b>Цель:</b> ${esc(w.g)}</p><div class="card"><div class="row hd"><div>День</div><div>Теория — 1 ч</div><div>Практика — 1 ч</div></div>`;
 w.d.forEach((d,j)=>{h+=`<div class="row"><div class="day">${days[j]}<small>2 ч</small></div><div>${item(`${i}-${j}-t`,d[0],d[1],links(d[2]))}</div><div>${item(`${i}-${j}-p`,"Задание",d[3])}</div></div>`});
 h+=`<div class="row proj"><div class="day">Сб<small>4 ч · проект</small></div><div>${item(i+"-s","Проект",w.p[0])}</div></div><div class="row proj"><div class="day">Вс<small>4 ч · проект</small></div><div>${item(i+"-u","Проект",w.p[1])}</div></div></div>`;
 m.innerHTML=h;
}
function all(){nav();prog();view()}
document.getElementById("nav").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.tab;try{localStorage.setItem(KEY+"-tab",cur)}catch(x){}all();scrollTo(0,0)};
document.getElementById("main").onchange=e=>{const c=e.target;if(!c.dataset.id)return;st[c.dataset.id]=c.checked;if(!c.checked)delete st[c.dataset.id];save();c.closest(".item").classList.toggle("done",c.checked);nav();prog()};
document.getElementById("rst").onclick=()=>{if(confirm("Сбросить все отметки?")){st={};save();all()}};
all();
</script>
